name: macOS application build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build Apple Silicon and Intel
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project SpeechSculptor.xcodeproj -scheme SpeechSculptor -configuration Release \
            -sdk macosx -destination 'generic/platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO ARCHS='arm64 x86_64' build | tee build-output.log
      - name: Generate and embed app icon
        shell: bash
        run: |
          set -euo pipefail
          swift scripts/generate_icon.swift build/SpeechSculptor.iconset
          iconutil -c icns build/SpeechSculptor.iconset -o build/SpeechSculptor.icns
          APP='build/Build/Products/Release/SpeechSculptor.app'
          cp build/SpeechSculptor.icns "$APP/Contents/Resources/SpeechSculptor.icns"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIconFile string SpeechSculptor' "$APP/Contents/Info.plist" || \\
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIconFile SpeechSculptor' "$APP/Contents/Info.plist"
      - name: Package app
        shell: bash
        run: |
          set -euo pipefail
          APP='build/Build/Products/Release/SpeechSculptor.app'
          test -d "$APP"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" 'dist/SpeechSculptor-macOS-development.zip'
          shasum -a 256 'dist/SpeechSculptor-macOS-development.zip' > 'dist/SHA256SUMS.txt'
      - name: Upload compiled app
        uses: actions/upload-artifact@v4
        with:
          name: SpeechSculptor-macOS-development
          path: dist/
          retention-days: 14
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SpeechSculptor-build-logs
          path: build-output.log
          if-no-files-found: ignore
