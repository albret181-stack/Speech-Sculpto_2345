name: Publish macOS release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Audio regression before publishing
        shell: bash
        run: bash scripts/test_audio_pipeline.sh
      - name: Check contextual speech scoring
        run: |
          swiftc -o /tmp/sculptor-context Sculptor/Models/AnalysisCore.swift Sculptor/Models/SpeechContext.swift Tests/ContextRegression.swift
          /tmp/sculptor-context
      - name: "Quality audit before publishing"
        run: |
          swiftc -o /tmp/sculptor-quality Sculptor/Models/AnalysisCore.swift Sculptor/Models/SpeechContext.swift Sculptor/Models/CoachEngine.swift Tests/QualityAudit.swift
          /tmp/sculptor-quality
      - name: "Russian filler benchmark before publishing"
        run: |
          swiftc -o /tmp/sculptor-benchmark Sculptor/Models/AnalysisCore.swift Sculptor/Models/SpeechContext.swift Tests/FillerBenchmark.swift
          /tmp/sculptor-benchmark
      - name: "Acoustic signal regression before publishing"
        run: |
          python3 scripts/generate_acoustic_fixtures.py
          swiftc -o /tmp/sculptor-acoustic Sculptor/Models/AnalysisCore.swift Sculptor/Models/SpeechContext.swift Sculptor/Services/AudioAnalyzer.swift Tests/AcousticQuality.swift
          /tmp/sculptor-acoustic
      - name: Build macOS universal application
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project SpeechSculptor.xcodeproj -scheme SpeechSculptor -configuration Release \
            -sdk macosx -destination 'generic/platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO ARCHS='arm64 x86_64' build 2>&1 | tee build-output.log
      - name: Embed app icon
        shell: bash
        run: |
          set -euo pipefail
          swift scripts/generate_icon.swift build/SpeechSculptor.iconset
          iconutil -c icns build/SpeechSculptor.iconset -o build/SpeechSculptor.icns
          APP='build/Build/Products/Release/SpeechSculptor.app'
          mkdir -p "$APP/Contents/Resources"
          cp build/SpeechSculptor.icns "$APP/Contents/Resources/SpeechSculptor.icns"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIconFile string SpeechSculptor' "$APP/Contents/Info.plist" || true
      - name: Package with integrity digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --keepParent build/Build/Products/Release/SpeechSculptor.app dist/SpeechSculptor-macOS-development.zip
          cd dist && shasum -a 256 SpeechSculptor-macOS-development.zip > SHA256SUMS.txt
      - name: Publish GitHub Release automatically
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Build/Products/Release/SpeechSculptor.app/Contents/Info.plist)"
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; not overwriting a published binary."
            exit 0
          fi
          gh release create "$tag" dist/SpeechSculptor-macOS-development.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Скульптор речи $tag" \
            --notes "Обновление приложения. Улучшено декодирование аудиофайлов и обнаружение новых версий. Экспериментальная неподписанная сборка macOS." \
            --latest
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,assets
      - name: Keep workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeechSculptor-release-candidate
          path: dist/
          retention-days: 14
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SpeechSculptor-release-build-log
          path: build-output.log
          if-no-files-found: ignore
