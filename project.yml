name: SpeechSculptor
options:
  bundleIdPrefix: studio.speechsculptor
  deploymentTarget:
    macOS: '14.2'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '14.2'
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  SpeechSculptor:
    type: application
    platform: macOS
    sources:
      - path: Sculptor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.speechsculptor.mac
        PRODUCT_NAME: SpeechSculptor
        INFOPLIST_FILE: Sculptor/Info.plist
        SWIFT_VERSION: '5.0'
        CODE_SIGNING_ALLOWED: NO
